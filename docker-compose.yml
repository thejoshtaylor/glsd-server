services:
  api:
    build: ./backend
    command: >
      gunicorn app.main:app
      --workers 1
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --timeout 120
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build: ./frontend
    depends_on:
      - api
    expose:
      - "80"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-glsd}
      POSTGRES_USER: ${POSTGRES_USER:-glsd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glsd_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glsd} -d ${POSTGRES_DB:-glsd}"]
      interval: 5s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

volumes:
  postgres_data:
